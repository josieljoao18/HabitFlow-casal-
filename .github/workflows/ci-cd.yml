name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  id-token: write

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter (TypeScript Verification)
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test

      - name: Build Application
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 7

  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: dist

      # -- STAGING DEPLOYMENT CONFIGURATIONS (Choose yours below) --

      # option A: Firebase Hosting (Highly recommended for Firebase apps)
      # Uncomment the step below to enable automated Firebase Hosting deployments.
      # Requires adding FIREBASE_SERVICE_ACCOUNT_REACT_EXAMPLE to your Github repository secrets.
      #
      # - name: Deploy to Firebase Hosting (Staging)
      #   uses: FirebaseExtended/action-hosting-deploy@v0
      #   with:
      #     repoToken: '${{ secrets.GITHUB_TOKEN }}'
      #     firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      #     expires: 30d
      #     projectId: react-example

      # Option B: General Staging Deploy Placeholder (e.g. Cloud Run, Vercel, Netlify)
      - name: Simulated Deploy to Staging
        run: |
          echo "🚀 Starting automated deployment pipeline..."
          echo "📦 Deploying compiled artifacts from 'dist/' directory to Staging environment..."
          echo "✅ Staging Deployment finished successfully!"
